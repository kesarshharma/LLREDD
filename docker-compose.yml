version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leredd-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leredd-ui
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=mock
    depends_on:
      - api
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: leredd-redis
    ports:
      - "6379:6379"
